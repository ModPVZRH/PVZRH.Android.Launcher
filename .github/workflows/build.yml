name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull LFS files
        run: git lfs pull

      - name: Increment CI version
        run: |
          VERSION=$(cat ci-version.txt)
          NEW_VERSION=$((VERSION + 1))
          echo $NEW_VERSION > ci-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-version.txt
          git commit -m "ci: bump version to $NEW_VERSION" || true
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.0.12077973 cmake;3.22.1

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read CI version
        id: ci_version
        run: |
          VERSION=$(cat ci-version.txt | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            VERSION=366
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -PciVersion=${{ steps.ci_version.outputs.version }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
